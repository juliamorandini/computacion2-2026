services:
  api:
    build: .
    container_name: tp2_api
    ports:
      - "8000:8000"
    environment:
      - WORKERS=4
      - COLA_MAX=100
      - TIMEOUT_DEFAULT=30
      - LIMITE_APAGADO=10
      - DIR_ESTADO=/app/estado
    volumes:
      - estado_data:/app/estado
    stop_grace_period: 15s
    depends_on:
      - servidor_lento

  servidor_lento:
    build:
      context: .
      dockerfile: Dockerfile.servidor_lento
    container_name: tp2_servidor_lento
    ports:
      - "9000:9000"
    environment:
      - PUERTO=9000

volumes:
  estado_data:
